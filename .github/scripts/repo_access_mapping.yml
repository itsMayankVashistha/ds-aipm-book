# repo_access_mapping.yml
#
# Maps a calendar "topic of the day" title DIRECTLY to the internal
# GitHub repo(s) that should be granted to the current cohort's team.
#
# IMPORTANT: this is intentionally keyed by the exact calendar topic text —
# the SAME keys used in topic_mapping.yml — not by _toc.yml file paths.
# Some days have a repo but no slide yet (no _toc.yml entry exists), so
# tying repo access to slide existence would silently skip those days.
# This file and topic_mapping.yml are two independent lookups off the same
# calendar topic text; a topic can appear in one, both, or neither.
#
# Entry formats:
#   1. Plain string  -> same repo for both tracks
#        "Bias Variance Tradeoff": neuefische/ds-predictive-regression
#
#   2. List          -> multiple repos, same for both tracks
#        "Data visualization":
#          - neuefische/ds-visualisation
#          - neuefische/ds-vizualization_libs-intro
#
#   3. Dict with aipm/ds keys -> tracks need DIFFERENT repos (e.g. a PM
#      framing session on the AIPM side vs. a hands-on technical repo on
#      the DS side for the same calendar day)
#        "Introduction to AIPM":
#          aipm: neuefische/aipm-course-curriculum
#          ds: neuefische/ds-python-basics
#
# Purely non-technical days (career sessions, "Time for Career", GDPR/AI Act
# policy discussion, Graduation, personal-reflection exercises like
# "Manual of Me", etc.) have no repo and are simply left out — the script
# skips them with a log line, which is correct.

repos:
  "Set up and Installation": neuefische/ds-getting-started
  "Introduction to ML + Python basics": neuefische/ds-python-basics
  "Introduction to AIPM + Python Basics": neuefische/ds-python-basics
