# topic_mapping.yml
#
# Maps the exact "topic of the day" text from the Google Calendar all-day
# event to the corresponding `file:` path in _toc.yml.
#
# The calendar title must match EXACTLY (case-sensitive) as it appears in
# the calendar event summary.
#
# This repo serves BOTH the AIPM and Data Science tracks. Which track is
# "live" is set via the COHORT_TRACK repo variable (aipm | ds) — update
# that once per cohort, same as you'd update GCAL_ICS_URL.
#
# Three entry formats are supported:
#   1. Plain string  -> same file for both tracks (topic doesn't diverge)
#        "Bias Variance Tradeoff": sessions/09.1_Bias_Variance_Tradeoff
#
#   2. List of strings -> multiple files for both tracks
#        "Topic": [sessions/part1, sessions/part2]
#
#   3. Dict with aipm/ds keys -> tracks diverge, pick based on COHORT_TRACK
#        "Linear Regression":
#          aipm: sessions/aipm_sessions/Linear_Regression_AIPM
#          ds: sessions/08_Linear_Regression
#
# Topics with no slide at all (career sessions, non-technical activities,
# etc.) should simply be left out — the script skips them silently.

mappings:
  "Bootcamp Introduction, Learning components, Tech Industry Overview": sessions/01_Orientation
  "Command line tutorial + Intro to Git": sessions/02_Git_Workflows
  "Introduction to ML + Python basics":
    ds: sessions/03_Intro_to_Data_Science_ML
  "Introduction to AIPM + Python Basics":
    aipm: sessions/aipm_sessions/Intro_to_AIPM
  "Intro to SQL": sessions/05.2_Intro_to_SQL
  "EDA Intro & Data Cleaning": sessions/07_Intro_EDA
  "EDA project": sessions/07.2_EDA_process
  "EDA Project + Presentations": sessions/07.2_EDA_process
  "Linear Regression":
