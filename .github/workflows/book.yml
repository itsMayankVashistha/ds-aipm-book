name: deploy-book
# Runs when the topic-reveal workflow finishes successfully,
# or when someone pushes directly to main under DSBOOK/,
# or manually via workflow_dispatch.
on:
  workflow_run:
    workflows: ["Reveal scheduled topic from calendar"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'DSBOOK/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    # Only proceed if:
    # - it's a push or manual trigger, OR
    # - it's a workflow_run AND that run succeeded (not skipped/failed)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        # For workflow_run, check out the exact commit that triggered it,
        # not just the tip of main (which could have moved on since).
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}

    # Install uv (also provides the pinned Python)
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    # Build the book
    - name: Build the book
      run: |
        uv run jupyter-book build DSBOOK
        mv ./DSBOOK/images/ ./DSBOOK/_build/html/

    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.5.9
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./DSBOOK/_build/html
        keep_files: false
