name: Sync cohort team repo access

on:
  schedule:
    # Same DST-safe double-schedule pattern as reveal-topic.yml.
    # 15:00 UTC = 17:00 CEST (summer, UTC+2)
    - cron: '0 15 * * *'
    # 16:00 UTC = 17:00 CET (winter, UTC+1)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Override date to check (YYYY-MM-DD). Leave blank for the next weekday.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (preview only, do not call GitHub API)'
        required: false
        type: boolean
        default: true

jobs:
  check-time:
    if: github.repository != 'neuefische/ds-book-template'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if it's actually 17:00 in Berlin right now
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_hour=$(TZ="Europe/Berlin" date +%H)
          echo "Current Berlin hour: $current_hour"

          if [ "$current_hour" = "17" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  sync-team-access:
    needs: check-time
    if: >-
      github.repository != 'neuefische/ds-book-template' &&
      needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Sync team repo access
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          COHORT_TRACK: ${{ vars.COHORT_TRACK }}
          GH_ORG: ${{ vars.GH_ORG }}
          TEAM_SLUG: ${{ vars.TEAM_SLUG }}
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.test_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python .github/scripts/sync_team_repo_access.py
